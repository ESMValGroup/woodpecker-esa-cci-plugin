name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pre-commit:
    name: Pre-commit (ruff, mypy, basic checks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # setuptools-scm needs git history

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default
          locked: true

      - name: Run pre-commit
        run: pixi run pre-commit run --all-files --show-diff-on-failure

  tests:
    name: Tests (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lowest and most recent supported Python version, and with xcube.
        environment: [py311, py314, xcube]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: ${{ matrix.environment }}
          locked: true

      - name: Run tests
        run: pixi run -e ${{ matrix.environment }} test

  tests-woodpecker-main:
    name: Tests (woodpecker main)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default
          locked: true

      - name: Install woodpecker main
        # Force the reinstall because main may carry the same version number
        # as the conda package, then install any new dependencies.
        run: |
          url="roocs-woodpecker @ git+https://github.com/roocs/woodpecker@main"
          pixi run python -m pip install --force-reinstall --no-deps "$url"
          pixi run --no-install python -m pip install "$url"

      - name: Run tests
        run: pixi run --no-install test
