name: Nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  tests-woodpecker-main:
    name: Tests (woodpecker main)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          environments: default
          locked: true

      - name: Install woodpecker main
        # Force the reinstall because main may carry the same version number
        # as the conda package, then install any new dependencies.
        run: |
          url="roocs-woodpecker @ git+https://github.com/roocs/woodpecker@main"
          pixi run python -m pip install --force-reinstall --no-deps "$url"
          pixi run --no-install python -m pip install "$url"

      - name: Run tests
        run: pixi run --no-install test
