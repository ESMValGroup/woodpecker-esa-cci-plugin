# Cloud properties and radiative fluxes from the monthly level 3 AVHRR
# products, v3.0, of the morning (AM) and afternoon (PM) satellites. Each
# recipe provides one CMIP7 variable, and they all match the same datasets,
# so select one with its recipe id. Steps with options that are the same in
# all recipes are defined in the first recipe, and reused in the others with
# YAML aliases (*name).
recipes:
  - id: esa_cci.cloud_clt
    description: >-
      Prepare the total cloud fraction (cfc) of ESA CCI monthly AVHRR cloud
      datasets, v3.0, as the CMIP7 variable clt
    match:
      path_patterns: &avhrr_patterns
        - "*ESACCI-L3C_CLOUD-CLD_PRODUCTS-AVHRR_?M-*-fv3.0-kr*"
        - "*esacci.CLOUD.mon.L3C.CLD_PRODUCTS.multi-sensor.multi-platform.AVHRR-?M.3-0.r1"
    steps:
      # Steps run in the order listed here. The variables are renamed last,
      # so all steps use the original variable names. Woodpecker allows each
      # fix only once per recipe.
      # Packing and the range attributes become invalid when the values
      # change, so remove them first. The time encoding is kept.
      - id: esa_cci.remove_packing
      - id: esa_cci.remove_range_attributes
      # Attributes that the Open Data Portal store adds to describe the
      # original files.
      - id: esa_cci.remove_xcube_cci_odp_attributes
      # The Kerchunk and zarr stores have the time points at the start of
      # each month and no time bounds, so add them before the steps that
      # change the bounds.
      - &center_time
        id: esa_cci.center_time
        options:
          coordinate: time
          frequency: mon
      # The Kerchunk and zarr stores leave out the months without data of
      # AVHRR-PM, September 1994 to January 1995, which the Open Data Portal
      # store has with missing values.
      - &fill_time_gaps
        id: esa_cci.fill_time_gaps
        options:
          coordinate: time
          frequency: mon
      # There are no latitude and longitude bounds. Before normalizing the
      # longitude, so the bounds are wrapped too.
      - &add_bounds
        id: esa_cci.add_bounds
        options:
          coordinates: [lat, lon]
      - id: esa_cci.set_attributes
        options:
          attributes:
            cfc: &cfc_attributes
              long_name: Total Cloud Cover Percentage
              cell_methods: "area: time: mean"
              # Keeps the uncertainties, the standard deviation and the
              # number of observations when selecting variables. The
              # correlated uncertainty cfc_corr_unc is left out: it is zero
              # everywhere.
              ancillary_variables: cfc_unc cfc_prop_unc cfc_std nobs
            # The Product User Guide (D3.3, v5.1) describes how the monthly
            # values are computed from the pixels: Level-3C means and
            # uncertainties in its Annex C.
            cfc_unc: &cfc_unc_attributes
              standard_name: cloud_area_fraction standard_error
              comment: >-
                Mean of the uncertainties of the pixels in the grid cell:
                the uncertainty of the cloud fraction if their errors are
                fully correlated.
            # Smaller than cfc_unc, by about the square root of the number
            # of observations, so not the uncertainty if the errors are
            # correlated. The Product User Guide does not say how it is
            # normalized, so it has no CF standard name.
            cfc_prop_unc:
              comment: >-
                The uncertainties of the pixels in the grid cell added in
                quadrature.
            cfc_std: &cfc_std_attributes
              # The standard deviation of the cloud mask of the pixels.
              standard_name: cloud_area_fraction
              cell_methods: "area: time: standard_deviation"
            nobs: &nobs_attributes
              standard_name: number_of_observations
            time: &time_attributes
              # xarray decodes the times to numpy datetime64 or cftime,
              # which do not count leap seconds. Times that are not decoded
              # are converted with them by esa_cci.set_time_units.
              units_metadata: "leap_seconds: none"
              # Required by CMIP7 for the coordinates.
              axis: T
            lat: &lat_attributes
              axis: "Y"
            lon: &lon_attributes
              axis: X
      - &remove_attributes
        id: esa_cci.remove_attributes
        options:
          attributes:
            # Bounds variables inherit the standard_name and long_name of
            # their coordinate, and CF recommends leaving them out. The Open
            # Data Portal store sets the invalid standard_name time_bnds.
            lat_bnds: &bounds [standard_name, long_name, comment]
            lon_bnds: *bounds
            time_bnds: *bounds
      - id: esa_cci.set_global_attributes
        options:
          attributes:
            <<: &global_attributes
              Conventions: CF-1.11
              frequency: mon
              realm: atmos
            # The CMIP7 variable, after renaming.
            variable_id: clt
            branded_variable: clt_tavg-u-hxy-u
      - &set_time_units
        id: esa_cci.set_time_units
        options:
          coordinate: time
          units: days since 1850-01-01
          # xarray decodes the times to numpy datetime64, which uses the
          # proleptic Gregorian calendar.
          calendar: proleptic_gregorian
      - &convert_cfc_units
        id: esa_cci.convert_units
        options:
          units:
            cfc: "%"
            cfc_std: "%"
      # CMIP7 stores data in single precision, and coordinates in double
      # precision.
      - id: esa_cci.set_data_types
        options:
          data_types: &cfc_data_types
            <<: &coordinate_data_types
              lat: float64
              lon: float64
              lat_bnds: float64
              lon_bnds: float64
            cfc: float32
      - &normalize_longitude
        id: esa_cci.normalize_longitude
        options:
          coordinate: lon
      - &select_cfc
        id: esa_cci.select_variables
        options:
          variables: [cfc]
      - &rename_cfc
        id: woodpecker.rename_variables
        options:
          mapping:
            clt: [cfc]

  # The zarr store only has the cloud fraction variables, without
  # cfc_prop_unc.
  - id: esa_cci.cloud_clt_zarr
    description: >-
      Prepare the total cloud fraction (cfc) of the ESA CCI monthly AVHRR
      cloud dataset, v3.0, in the zarr store as the CMIP7 variable clt
    match:
      path_patterns:
        - "*ESACCI-L3C_CLOUD-CLD_PRODUCTS-AVHRR_NOAA-1982-2016-fv3.0.zarr"
    steps:
      - id: esa_cci.remove_packing
      - id: esa_cci.remove_range_attributes
      - id: esa_cci.remove_xcube_cci_odp_attributes
      - *center_time
      - *fill_time_gaps
      - *add_bounds
      - id: esa_cci.set_attributes
        options:
          attributes:
            cfc:
              <<: *cfc_attributes
              ancillary_variables: cfc_unc cfc_std nobs
            cfc_unc: *cfc_unc_attributes
            cfc_std: *cfc_std_attributes
            nobs: *nobs_attributes
            time: *time_attributes
            lat: *lat_attributes
            lon: *lon_attributes
      - *remove_attributes
      - id: esa_cci.set_global_attributes
        options:
          attributes:
            <<: *global_attributes
            variable_id: clt
            branded_variable: clt_tavg-u-hxy-u
      - *set_time_units
      - *convert_cfc_units
      - id: esa_cci.set_data_types
        options:
          data_types: *cfc_data_types
      - *normalize_longitude
      - *select_cfc
      - *rename_cfc

  # The uncertainties of the water paths, such as lwp_unc, are those of the
  # in-cloud values lwp and iwp, not of the all-sky grid box means, and the
  # fluxes have no uncertainties, so the other recipes keep no ancillary
  # variables.
  - id: esa_cci.cloud_lwp
    description: >-
      Prepare the all-sky cloud liquid water path (lwp_allsky) of ESA
      CCI monthly AVHRR cloud datasets, v3.0, as the CMIP7 variable lwp
    match:
      path_patterns: *avhrr_patterns
    steps:
      - id: esa_cci.remove_packing
      - id: esa_cci.remove_range_attributes
      - id: esa_cci.remove_xcube_cci_odp_attributes
      - *center_time
      - *fill_time_gaps
      - *add_bounds
      - id: esa_cci.set_attributes
        options:
          attributes:
            lwp_allsky:
              <<: &mean_attributes
                cell_methods: "area: time: mean"
              long_name: Liquid Water Path
            time: *time_attributes
            lat: *lat_attributes
            lon: *lon_attributes
      - *remove_attributes
      - id: esa_cci.set_global_attributes
        options:
          attributes:
            <<: *global_attributes
            realm: aerosol
            variable_id: lwp
            branded_variable: lwp_tavg-u-hxy-u
      - *set_time_units
      - id: esa_cci.convert_units
        options:
          units:
            lwp_allsky: kg m-2
      - id: esa_cci.set_data_types
        options:
          data_types:
            <<: *coordinate_data_types
            lwp_allsky: float32
      - *normalize_longitude
      - id: esa_cci.select_variables
        options:
          variables: [lwp_allsky]
      - id: woodpecker.rename_variables
        options:
          mapping:
            lwp: [lwp_allsky]

  - id: esa_cci.cloud_clivi
    description: >-
      Prepare the all-sky cloud ice water path (iwp_allsky) of ESA CCI
