# The water vapour datasets differ in their time steps and variables, so
# there is a recipe for each product version and frequency. Steps with
# options that are the same in all recipes are defined in the first recipe,
# and reused in the others with YAML aliases (*name).
recipes:
  - id: esa_cci.water_vapour
    description: Prepare ESA CCI monthly water vapour (TCWV) datasets, v3.2
    match:
      path_patterns:
        - "*ESACCI-WATERVAPOUR-L3C-TCWV-meris-*-2002-2017-fv3.2.zarr"
        - "*ESACCI-WATERVAPOUR-L3C-TCWV-meris-*-200207-201712-fv3.2-kr*"
        - "*esacci.WATERVAPOUR.mon.L3S.TCWV.multi-sensor.multi-platform.TCWV_land_*.3-2.r1"
    steps:
      # Steps run in the order listed here. The variables are renamed last,
      # so all steps use the original variable names. Woodpecker allows each
      # fix only once per recipe.
      # Packing and the range attributes become invalid when the values
      # change, so remove them first. The time encoding is kept.
      - id: esa_cci.remove_packing
      - id: esa_cci.remove_range_attributes
      # Attributes that the Open Data Portal store adds to describe the
      # original files.
      - id: esa_cci.remove_xcube_cci_odp_attributes
      - id: esa_cci.set_attributes
        options:
          attributes:
            tcwv: &tcwv_attributes
              standard_name: atmosphere_mass_content_of_water_vapor
              long_name: Water Vapor Path
              cell_methods: "area: time: mean"
              # Keeps crs when selecting variables.
              grid_mapping: crs
              # Keeps the uncertainties, the standard deviation and the
              # number of retrievals when selecting variables.
              ancillary_variables: stdv num_obs tcwv_err tcwv_ran
            # The monthly values are the means of the daily values, except
            # num_obs, which is their sum, as described in the Product User
            # Guide (D4.3, issue 2.2) and checked against the daily data.
            stdv: &stdv_attributes
              # The standard deviation of the retrievals in the grid cell.
              standard_name: atmosphere_mass_content_of_water_vapor
              cell_methods: >-
                area: time: standard_deviation within days
                time: mean over days
            num_obs: &num_obs_attributes
              standard_name: number_of_observations
              units: "1"
            tcwv_err: &tcwv_err_attributes
              standard_name: >-
                atmosphere_mass_content_of_water_vapor standard_error
              comment: >-
                Mean over the days of the month of the mean of the
                uncertainties of the retrievals in the grid cell on each
                day: the uncertainty of the total column water vapour if
                their errors are fully correlated.
            # Not the uncertainty of the total column water vapour, so it has
            # no CF standard name.
            tcwv_ran: &tcwv_ran_attributes
              # The name in the Product User Guide. Some stores call it
              # Random retrieval uncertainty.
              long_name: Propagated retrieval uncertainty
              comment: >-
                Mean over the days of the month of the root mean square of
                the uncertainties of the retrievals in the grid cell on each
                day.
            time: &time_attributes
              # xarray decodes the times to numpy datetime64 or cftime,
              # which do not count leap seconds. Times that are not decoded
              # are converted with them by esa_cci.set_time_units.
              units_metadata: "leap_seconds: none"
            lat: &lat_attributes
              # The Kerchunk and Open Data Portal stores have a trailing
              # space in the units.
              units: degrees_north
      - &remove_attributes
        id: esa_cci.remove_attributes
        options:
          attributes:
            # Not valid CF standard_names. The other variables get valid
            # ones from esa_cci.set_attributes.
            crs: [standard_name]
            tcwv_ran: [standard_name]
            # Bounds variables inherit the standard_name and long_name of
            # their coordinate, and CF recommends leaving them out. The Open
            # Data Portal store sets the invalid standard_name time_bnds.
            lat_bnds: &bounds [standard_name, long_name, comment]
            lon_bnds: *bounds
            time_bnds: *bounds
      - id: esa_cci.set_global_attributes
        options:
          attributes: &global_attributes
            Conventions: CF-1.11
            # The CMIP7 variable, after renaming.
            variable_id: prw
            branded_variable: prw_tavg-u-hxy-u
            frequency: mon
            realm: atmos
      - &remove_global_attributes
        id: esa_cci.remove_global_attributes
        options:
          # CF attribute names cannot contain hyphens.
          attributes: [keywords-vocabulary, naming-authority]
      - &set_time_units
        id: esa_cci.set_time_units
        options:
          coordinate: time
          units: days since 1850-01-01
          # xarray decodes the times to numpy datetime64, which uses the
          # proleptic Gregorian calendar.
          calendar: proleptic_gregorian
      # The time points are on the 15th of each month, and the bounds leave
      # out the last day of each month.
      - id: esa_cci.center_time
        options:
          coordinate: time
          frequency: mon
      - &convert_units
        id: esa_cci.convert_units
        options:
          units:
            tcwv: kg m-2
            stdv: kg m-2
            tcwv_err: kg m-2
            tcwv_ran: kg m-2
      # CMIP7 stores data in single precision, and coordinates in double
      # precision.
      - &set_data_types
        id: esa_cci.set_data_types
        options:
          data_types:
            tcwv: float32
            lat: float64
            lon: float64
            lat_bnds: float64
            lon_bnds: float64
      - &grid_mapping_from_wkt
        id: esa_cci.grid_mapping_from_wkt
        options:
          variable: crs
          wkt_attribute: wkt
      - id: woodpecker.ensure_latitude_is_increasing
      - &normalize_longitude
        id: esa_cci.normalize_longitude
        options:
          coordinate: lon
      - &select_variables
        id: esa_cci.select_variables
        options:
          variables: [tcwv]
      - &rename_variables
        id: woodpecker.rename_variables
        options:
          mapping:
            prw: [tcwv]

  - id: esa_cci.water_vapour_daily
    description: Prepare ESA CCI daily water vapour (TCWV) datasets, v3.2
    match:
      path_patterns:
        - "*ESACCI-WATERVAPOUR-L3C-TCWV-meris-*-20020701-20171231-fv3.2-kr*"
        - "*esacci.WATERVAPOUR.day.L3S.TCWV.multi-sensor.multi-platform.TCWV_land_*.3-2.r1"
    steps:
      - id: esa_cci.remove_packing
      - id: esa_cci.remove_range_attributes
      - id: esa_cci.remove_xcube_cci_odp_attributes
      - id: esa_cci.set_attributes
        options:
          attributes:
            tcwv: *tcwv_attributes
            stdv: &daily_stdv_attributes
              <<: *stdv_attributes
              cell_methods: "area: time: standard_deviation"
            num_obs: *num_obs_attributes
            tcwv_err: &daily_tcwv_err_attributes
              <<: *tcwv_err_attributes
              comment: >-
                Mean of the uncertainties of the retrievals in the grid
                cell: the uncertainty of the total column water vapour if
                their errors are fully correlated.
            tcwv_ran: &daily_tcwv_ran_attributes
              <<: *tcwv_ran_attributes
              comment: >-
                Root mean square of the uncertainties of the retrievals in
                the grid cell. Divided by the square root of the number of
                retrievals, it is the uncertainty of the total column water
                vapour if their errors are uncorrelated.
            time: *time_attributes
            lat: *lat_attributes
      - *remove_attributes
      - id: esa_cci.set_global_attributes
        options:
          attributes:
            <<: *global_attributes
            frequency: day
      - *remove_global_attributes
      - *set_time_units
      # The time points are at the start of each day in the Kerchunk store.
      - id: esa_cci.center_time
        options:
          coordinate: time
          frequency: day
      - *convert_units
      - *set_data_types
      - *grid_mapping_from_wkt
      - id: woodpecker.ensure_latitude_is_increasing
      - *normalize_longitude
      - *select_variables
      - *rename_variables

  # Version 4.2 has no num_obs variable, but a variable with the number of
  # retrievals of each sensor, and only in the Open Data Portal store.
  - id: esa_cci.water_vapour_v4
    description: Prepare ESA CCI monthly water vapour (TCWV) datasets, v4.2
    match:
      path_patterns:
        - "*esacci.WATERVAPOUR.mon.L3S.TCWV.multi-sensor.multi-platform.TCWV_land_*.4-2.r1"
    steps:
      - id: esa_cci.remove_packing
      - id: esa_cci.remove_range_attributes
      - id: esa_cci.remove_xcube_cci_odp_attributes
      - id: esa_cci.set_attributes
        options:
          attributes:
            tcwv: &tcwv_v4_attributes
              <<: *tcwv_attributes
              # It refers to num_obs, which does not exist.
              ancillary_variables: stdv tcwv_err tcwv_ran
            stdv: *stdv_attributes
            tcwv_err: *tcwv_err_attributes
            tcwv_ran: *tcwv_ran_attributes
            time: *time_attributes
            lat: *lat_attributes
      - *remove_attributes
      - id: esa_cci.set_global_attributes
        options:
          attributes: *global_attributes
      - *remove_global_attributes
      - *set_time_units
      - id: esa_cci.center_time
        options:
          coordinate: time
          frequency: mon
      - *convert_units
      - *set_data_types
      - *grid_mapping_from_wkt
      - id: woodpecker.ensure_latitude_is_increasing
      - *normalize_longitude
      - *select_variables
      - *rename_variables

  - id: esa_cci.water_vapour_v4_daily
    description: Prepare ESA CCI daily water vapour (TCWV) datasets, v4.2
    match:
      path_patterns:
        - "*esacci.WATERVAPOUR.day.L3S.TCWV.multi-sensor.multi-platform.TCWV_land_*.4-2.r1"
    steps:
      - id: esa_cci.remove_packing
      - id: esa_cci.remove_range_attributes
      - id: esa_cci.remove_xcube_cci_odp_attributes
      - id: esa_cci.set_attributes
        options:
          attributes:
            tcwv: *tcwv_v4_attributes
            stdv: *daily_stdv_attributes
            tcwv_err: *daily_tcwv_err_attributes
            tcwv_ran: *daily_tcwv_ran_attributes
            time: *time_attributes
            lat: *lat_attributes
      - *remove_attributes
      - id: esa_cci.set_global_attributes
        options:
          attributes:
            <<: *global_attributes
            frequency: day
      - *remove_global_attributes
      - *set_time_units
      - id: esa_cci.center_time
        options:
          coordinate: time
          frequency: day
      - *convert_units
      - *set_data_types
      - *grid_mapping_from_wkt
      - id: woodpecker.ensure_latitude_is_increasing
      - *normalize_longitude
      - *select_variables
      - *rename_variables
