recipes:
  - id: esa_cci.water_vapour
    description: Prepare ESA CCI water vapour (TCWV) datasets
    match:
      path_patterns:
        - "*ESACCI-WATERVAPOUR-*"
    steps:
      # Steps run in the order listed here and all use the original variable
      # names, so that recipe checks on unmodified data report every problem.
      # Woodpecker allows each fix only once per recipe.
      - id: esa_cci.convert_units
        options:
          units:
            tcwv: kg m-2
      # Runs before select_variables so that crs is kept through grid_mapping.
      - id: esa_cci.set_attributes
        options:
          attributes:
            tcwv:
              standard_name: atmosphere_mass_content_of_water_vapor
              long_name: Water Vapor Path
              cell_methods: "area: time: mean"
              grid_mapping: crs
            crs:
              # Not a valid CF standard_name.
              standard_name: null
      - id: esa_cci.grid_mapping_from_wkt
        options:
          variable: crs
          wkt_attribute: wkt
      - id: esa_cci.select_variables
        options:
          variables: [tcwv]
      - id: woodpecker.rename_variables
        options:
          mapping:
            prw: [tcwv]
      - id: woodpecker.ensure_latitude_is_increasing
