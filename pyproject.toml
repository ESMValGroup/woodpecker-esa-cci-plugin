[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8.1"]
build-backend = "setuptools.build_meta"

[project]
name = "woodpecker-esa-cci-plugin"
dynamic = ["version"]
description = "Woodpecker plugin for formatting ESA-CCI data according to CMIP7 standards"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
  "cf-xarray",
  "cftime",
  "pint",
  "pydantic>=2",
  "pyproj",
  "roocs-woodpecker>=0.7,<0.8",
  "xarray>=2024.1.0",
]

[project.entry-points."woodpecker.plugins"]
esa_cci = "woodpecker_esa_cci_plugin"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.11"
cf_xarray = "*"
cftime = "*"
pint = "*"
pydantic = ">=2"
pyproj = "*"
roocs-woodpecker = ">=0.7,<0.8"
xarray = ">=2024.1.0"

[tool.pixi.pypi-dependencies]
woodpecker-esa-cci-plugin = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
dask = "*"
mypy = "*"
pip = "*"
pre-commit = "*"
pytest = ">=8"
pytest-cov = "*"
pyyaml = "*"
ruff = "*"
types-pyyaml = "*"

[tool.pixi.feature.dev.tasks]
test = "pytest"
lint = "pre-commit run --all-files"

[tool.pixi.feature.xcube.dependencies]
xcube = ">=1.13"
xcube-cci = ">=0.14"
ncdata = "*"
iris = "*"

# Dependencies of the tests that download data from the ESA CCI Open Data
# Portal. ESMValCore requires zarr>3, while xcube-cci requires zarr<3, so this
# is a separate environment that opens the ESA CCI zarr store directly with
# s3fs.
[tool.pixi.feature.online.dependencies]
esmvalcore = ">=2.15"
ncdata = "*"
s3fs = "*"
compliance-checker = "*"
cc-plugin-wcrp = "*"

# Store the CMIP7 vocabularies that cc-plugin-wcrp checks against in the
# project, instead of the home directory.
[tool.pixi.feature.online.activation.env]
ESGVOC_HOME = "$PIXI_PROJECT_ROOT/.pixi/esgvoc"

# Lowest and most recent supported Python version.
[tool.pixi.feature.py311.dependencies]
python = "3.11.*"

[tool.pixi.feature.py314.dependencies]
python = "3.14.*"

[tool.pixi.environments]
default = ["dev"]
xcube = ["dev", "xcube"]
online = ["dev", "online"]
py311 = ["dev", "py311"]
py314 = ["dev", "py314"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
woodpecker_esa_cci_plugin = ["py.typed", "recipes/*.yaml"]

[tool.setuptools_scm]
version_scheme = "calver-by-date"
fallback_version = "0.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["woodpecker_esa_cci_plugin"]
branch = true

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # conflicts with ruff format
  "CPY001", # licensing is covered by the LICENSE file
  "ISC001", # conflicts with ruff format
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "D",       # no docstrings required in tests
  "PLR2004", # magic values are fine in assertions
  "S101",    # pytest uses assert
]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Remove once woodpecker ships a py.typed marker.
module = ["woodpecker", "woodpecker.*"]
follow_untyped_imports = true
