repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        exclude: ^pixi\.lock$
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: pixi-lock
        name: pixi lock
        entry: pixi lock
        language: system
        files: ^(pyproject\.toml|pixi\.lock)$
        pass_filenames: false
      # Runs in the project environment so mypy can see woodpecker and xarray.
      - id: mypy
        name: mypy
        entry: pixi run --frozen mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
